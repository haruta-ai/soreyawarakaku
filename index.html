<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8f0">
  <meta name="description" content="角を立てずに、本音は置いていかない。端末内で使える言い換え帳。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="やわらかく">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>それ、やわらかく</title>
</head>
<body>
  <a class="skip-link" href="#main">本文へ</a>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="それ、やわらかく ホーム"><span aria-hidden="true">○</span>それ、やわらかく</a>
    <button class="icon-button" id="install-button" hidden>ホームに追加</button>
  </header>
  <main id="main" tabindex="-1">
    <section class="view home" id="home-view" aria-labelledby="home-title">
      <div class="hero">
        <p class="eyebrow">本音はそのまま、角だけ丸く。</p>
        <h1 id="home-title">それ、<em>やわらかく</em></h1>
        <p>本音をタップすると、すぐ3案。会話が止まりそうなときの小さな味方です。</p>
      </div>
      <label class="search"><span aria-hidden="true">⌕</span><span class="sr-only">本音を検索</span><input id="search" type="search" enterkeyhint="search" placeholder="「無理」「急いで」などで検索" autocomplete="off"></label>
      <div class="quick-row" id="quick-row" aria-label="カテゴリ"></div>
      <section aria-labelledby="pick-title">
        <div class="section-head"><h2 id="pick-title">いまの本音は？</h2><span id="result-count"></span></div>
        <div class="phrase-list" id="phrase-list"></div>
        <div class="empty" id="search-empty" hidden><span>ふわっ…</span><h2>見つかりませんでした</h2><p>短い言葉で探すと、見つかるかもしれません。</p></div>
      </section>
    </section>

    <section class="view builder" id="builder-view" hidden aria-labelledby="builder-title">
      <button class="back" data-back type="button">← 戻る</button>
      <p class="step-label">STEP 1 / 3</p>
      <h1 id="builder-title"></h1>
      <p class="hint">誰に、どんな温度で伝えますか？</p>
      <fieldset><legend>相手</legend><div class="choice-grid" id="audience-choices"></div></fieldset>
      <fieldset><legend>トーン</legend><div class="choice-grid tone-grid" id="tone-choices"></div></fieldset>
      <button class="primary" id="make-button" type="button">言い換えをつくる <span>→</span></button>
    </section>

    <section class="view results" id="results-view" hidden aria-labelledby="results-title">
      <button class="back" data-back-to-builder type="button">← 相手・トーンを変える</button>
      <p class="step-label">3つできました</p>
      <h1 id="results-title">この言い方なら、<br>伝わりそうです。</h1>
      <p class="context" id="result-context"></p>
      <div id="result-cards"></div>
      <button class="secondary wide" id="restart-button" type="button">別の本音を選ぶ</button>
    </section>

    <section class="view library" id="library-view" hidden aria-labelledby="library-title">
      <div class="library-head"><div><p class="eyebrow">あとで、すぐ使える。</p><h1 id="library-title">保存した言葉</h1></div><button class="text-button" id="clear-history" type="button">履歴を消去</button></div>
      <div class="tabs" role="tablist" aria-label="保存した言葉の表示"><button role="tab" aria-selected="true" data-tab="favorites">お気に入り <span id="fav-count">0</span></button><button role="tab" aria-selected="false" data-tab="recent">最近使った <span id="recent-count">0</span></button></div>
      <div id="library-list" class="saved-list"></div>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="メインメニュー"><a href="#home" data-nav="home" aria-current="page"><span aria-hidden="true">⌂</span>見つける</a><a href="#library" data-nav="library"><span aria-hidden="true">♡</span>保存</a></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="data.js" defer></script><script src="app.js" defer></script>
</body>
</html>
